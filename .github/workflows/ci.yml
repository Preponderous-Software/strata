name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Test jobs run in an Ubuntu image pinned by digest whose packages come from
  # a dated archive snapshot, so Mesa (llvmpipe) is the same on every run.
  # Moving SNAPSHOT forward is a deliberate change that re-checks every golden.
  SNAPSHOT: 20261001T000000Z

jobs:
  # Release binaries are built on manylinux_2_28 (glibc 2.28, a current GCC
  # toolset), so libstrata.so loads on Ubuntu 20.04 and later. The golden
  # job tests these exact binaries rather than a second build.
  build-linux:
    name: Build (Linux, manylinux_2_28)
    runs-on: ubuntu-latest
    container: quay.io/pypa/manylinux_2_28_x86_64@sha256:39df0042d5cc900b085aa25a0659368b42a0006c54c474299b785b44c1b4ff82
    steps:
      - uses: actions/checkout@v4

      - name: Install SDL3 build dependencies
        run: |
          dnf install -y libX11-devel libXext-devel libXcursor-devel libXi-devel libXfixes-devel \
            libXrandr-devel libXScrnSaver-devel
          cmake --version
          gcc --version | head -1

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DSTRATA_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build -j4

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Check exported symbols
        run: |
          # Only the C ABI may be exported; SDL, glad and C++ internals stay hidden.
          nm -D --defined-only build/libstrata.so | awk '$2 == "T" {print $3}' | sort > exports.txt
          cat exports.txt
          if grep -v '^strata_' exports.txt; then echo "::error::libstrata exports non-strata symbols"; exit 1; fi
          objdump -T build/libstrata.so | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1

      - name: Stage binaries
        run: |
          mkdir -p dist/lib dist/bin dist/include/strata
          cp -P build/libstrata.so* dist/lib/
          cp build/strata-golden build/strata-imgcmp dist/bin/
          cp include/strata/strata.h dist/include/strata/
          cp LICENSE THIRD_PARTY_NOTICES.md dist/

      - uses: actions/upload-artifact@v4
        with:
          name: strata-linux-x64
          path: dist/
          if-no-files-found: error

  golden-linux:
    name: Golden images (llvmpipe) and C# harness
    needs: build-linux
    runs-on: ubuntu-latest
    container: ubuntu:24.04@sha256:68ee22004a9109b44973313b02ff7b1de250f1de0f5ecb628d73f579aaff33ac
    env:
      LIBGL_ALWAYS_SOFTWARE: "1"
      GALLIUM_DRIVER: llvmpipe
      __EGL_VENDOR_LIBRARY_FILENAMES: /usr/share/glvnd/egl_vendor.d/50_mesa.json
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - name: Install pinned Mesa, Xvfb and .NET 8
        run: |
          # snapshot.ubuntu.com is HTTPS-only, so certificates come first,
          # from the live archive; everything else comes from the snapshot.
          apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates
          apt-get update --snapshot "$SNAPSHOT"
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends --snapshot "$SNAPSHOT" \
            git libegl1 libegl-mesa0 libgl1-mesa-dri libglx-mesa0 libgl1 xvfb xauth \
            dotnet-sdk-8.0 python3
          dpkg-query -W libgl1-mesa-dri libegl-mesa0 dotnet-sdk-8.0

      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: strata-linux-x64
          path: dist

      - name: Golden images (headless EGL surfaceless)
        run: |
          chmod +x dist/bin/*
          LD_LIBRARY_PATH=dist/lib dist/bin/strata-golden check tests/scenes tests/golden golden-out/headless

      - name: Golden images (SDL3 window under Xvfb)
        run: |
          Xvfb :99 -screen 0 1024x768x24 &
          sleep 2
          DISPLAY=:99 LD_LIBRARY_PATH=dist/lib dist/bin/strata-golden check tests/scenes tests/golden golden-out/window --surface window

      - name: Golden images (GLES 3.0 device, the WebGL 2 backend, on llvmpipe)
        run: |
          # The device browsers use, run natively against the desktop goldens:
          # once with EXT_depth_clamp and once with the shader fallback that
          # browsers without it get.
          STRATA_GL_API=gles3 LD_LIBRARY_PATH=dist/lib \
            dist/bin/strata-golden check tests/scenes tests/golden golden-out/gles3
          STRATA_GL_API=gles3 STRATA_GLES_NO_DEPTH_CLAMP=1 LD_LIBRARY_PATH=dist/lib \
            dist/bin/strata-golden check tests/scenes tests/golden golden-out/gles3-no-depth-clamp

      - name: C# ABI layout tests
        env:
          STRATA_NATIVE_DIR: ${{ github.workspace }}/dist/lib
        run: dotnet test tests/csharp/Strata.Interop.Tests -c Release

      - name: Python binding (layouts, release fetch, headless drawing)
        env:
          STRATA_NATIVE_DIR: ${{ github.workspace }}/dist/lib
          STRATA_IMGCMP: ${{ github.workspace }}/dist/bin/strata-imgcmp
        run: |
          python3 --version
          python3 -m unittest discover -s tests/python -v

      - name: C# primitives harness (skeleton exit criterion)
        run: |
          mkdir -p golden-out/csharp
          dotnet run --project tests/csharp/Strata.PrimitivesHarness -c Release -- \
            tests/scenes/bn_primitives_legacy.scene golden-out/csharp/bn_primitives_legacy.actual.png --native-dir dist/lib
          LD_LIBRARY_PATH=dist/lib dist/bin/strata-imgcmp tests/golden/bn_primitives_legacy/linux-llvmpipe.png \
            golden-out/csharp/bn_primitives_legacy.actual.png --diff golden-out/csharp/bn_primitives_legacy.diff.png

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: golden-out
          path: golden-out/
          if-no-files-found: ignore

  sanitize:
    name: Sanitizers (ASan + UBSan, headless)
    runs-on: ubuntu-latest
    container: ubuntu:24.04@sha256:68ee22004a9109b44973313b02ff7b1de250f1de0f5ecb628d73f579aaff33ac
    env:
      LIBGL_ALWAYS_SOFTWARE: "1"
      GALLIUM_DRIVER: llvmpipe
      __EGL_VENDOR_LIBRARY_FILENAMES: /usr/share/glvnd/egl_vendor.d/50_mesa.json
      # Mesa's llvmpipe keeps caches alive for the life of the process.
      ASAN_OPTIONS: detect_leaks=0
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - name: Install toolchain and pinned Mesa
        run: |
          # snapshot.ubuntu.com is HTTPS-only, so certificates come first,
          # from the live archive; everything else comes from the snapshot.
          apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates
          apt-get update --snapshot "$SNAPSHOT"
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends --snapshot "$SNAPSHOT" \
            git g++ cmake make libegl1 libegl-mesa0 libgl1-mesa-dri
      - uses: actions/checkout@v4
      - name: Build (Debug, sanitizers, no SDL)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DSTRATA_SANITIZE=ON -DSTRATA_WITH_SDL=OFF
          cmake --build build -j4
      - name: Unit tests
        run: ctest --test-dir build --output-on-failure
      - name: Golden images under sanitizers
        run: build/strata-golden check tests/scenes tests/golden golden-out

  # Emscripten (WebGL 2): build the static libraries, the browser goldens
  # page and the demo, run the unit tests under Node, then draw every golden
  # scene in headless Chromium on SwiftShader (software WebGL 2) and compare
  # with the web goldens. emsdk and Playwright (hence Chromium and its
  # SwiftShader) are pinned, so the browser draws the same pixels every run.
  build-web:
    name: Build (Emscripten, WebGL 2) and browser goldens
    runs-on: ubuntu-24.04
    env:
      EMSDK_VERSION: "6.0.11"
      PLAYWRIGHT_VERSION: "1.61.1"
    steps:
      - uses: actions/checkout@v4

      - name: Install emsdk
        run: |
          git clone --depth 1 --branch "$EMSDK_VERSION" https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install "$EMSDK_VERSION"
          "$RUNNER_TEMP/emsdk/emsdk" activate "$EMSDK_VERSION"

      - name: Configure
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          emcc --version | head -1
          emcmake cmake -S . -B build-web -DCMAKE_BUILD_TYPE=Release -DSTRATA_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          cmake --build build-web -j4

      - name: Unit tests (Node)
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          ctest --test-dir build-web --output-on-failure

      - name: Check libstrata.a
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          # The one archive a consumer links must define the whole C ABI.
          grep -o 'STRATA_API [^(]*(' include/strata/strata.h | grep -o 'strata_[a-z0-9_]*' | sort -u > abi.txt
          emnm --defined-only build-web/libstrata.a 2>/dev/null | awk '$2 == "T" {print $3}' | grep '^strata_' | sort -u > defined.txt
          if ! comm -23 abi.txt defined.txt | tee missing.txt | grep -q .; then
            echo "libstrata.a defines all $(wc -l < abi.txt) C ABI functions"
          else
            echo "::error::libstrata.a is missing C ABI functions"; cat missing.txt; exit 1
          fi

      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --prefix tests/web "playwright@$PLAYWRIGHT_VERSION"
          npx --prefix tests/web playwright install --with-deps chromium

      - name: Golden images in Chromium (WebGL 2, SwiftShader)
        run: node tests/web/run_goldens.cjs build-web golden-out/web --platform web-swiftshader

      - name: Golden images in Chromium, depth clamp fallback
        env:
          STRATA_WEB_ENV: STRATA_GLES_NO_DEPTH_CLAMP=1
        run: node tests/web/run_goldens.cjs build-web golden-out/web-no-depth-clamp --platform web-swiftshader

      - name: Browser against the desktop goldens (default tolerance)
        run: node tests/web/run_goldens.cjs build-web golden-out/web-vs-desktop --platform linux-llvmpipe

      - name: Stage web build
        if: always()
        run: |
          mkdir -p dist-web/lib dist-web/include/strata dist-web/demo
          cp build-web/libstrata.a dist-web/lib/ || true
          cp include/strata/strata.h dist-web/include/strata/
          cp build-web/strata-village-day.html build-web/strata-village-day.js build-web/strata-village-day.wasm \
            build-web/strata-village-day.data dist-web/demo/ || true
          cp LICENSE THIRD_PARTY_NOTICES.md docs/WEB.md dist-web/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: strata-web
          path: dist-web/
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: golden-out-web
          path: golden-out/
          if-no-files-found: ignore

  build-windows:
    name: Build (Windows, MSVC)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build build --config Release -- /m:4
      - name: Unit tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Python binding layouts against strata.dll
        shell: bash
        env:
          STRATA_NATIVE_DIR: ${{ github.workspace }}/build/Release
          # No GL on the runner: layouts and calls that need no engine only.
          STRATA_PY_NO_RENDER: "1"
        run: |
          python --version
          python -m unittest discover -s tests/python -v
      - name: Stage binaries
        shell: bash
        run: |
          mkdir -p dist/bin dist/include/strata
          cp build/Release/strata.dll build/Release/strata.lib build/Release/strata-golden.exe build/Release/strata-imgcmp.exe dist/bin/
          cp include/strata/strata.h dist/include/strata/
          cp LICENSE THIRD_PARTY_NOTICES.md dist/
      - uses: actions/upload-artifact@v4
        with:
          name: strata-win-x64
          path: dist/
          if-no-files-found: error

  # Builds the release assets on every run, not only on tags, so a packaging
  # mistake fails a pull request instead of shipping. Artifact uploads drop
  # Unix file modes, so the executable bits are set again before tarring,
  # and the tarball itself is checked.
  package:
    name: Package release assets
    needs: [build-linux, build-web, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: strata-linux-x64
          path: linux
      - uses: actions/download-artifact@v4
        with:
          name: strata-win-x64
          path: windows
      - uses: actions/download-artifact@v4
        with:
          name: strata-web
          path: web
      - name: Package
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then version="${GITHUB_REF_NAME#v}"; else version="0.0.0-ci"; fi
          chmod 0755 linux/bin/strata-golden linux/bin/strata-imgcmp
          mkdir -p assets
          tar -C linux -czf "assets/strata-${version}-linux-x64.tar.gz" .
          (cd windows && zip -qr "../assets/strata-${version}-win-x64.zip" .)
          # Emscripten 6.0.11, -fwasm-exceptions: see docs/WEB.md before linking it.
          tar -C web -czf "assets/strata-${version}-wasm32-emscripten.tar.gz" .
          # Bare libraries too, so a consumer can fetch exactly one file and
          # check it against SHA256SUMS.
          cp -L linux/lib/libstrata.so "assets/libstrata-${version}-linux-x64.so"
          cp windows/bin/strata.dll "assets/strata-${version}-win-x64.dll"
          (cd assets && sha256sum * > SHA256SUMS)
          cat assets/SHA256SUMS
      - name: Check the Linux tarball keeps its executables executable
        run: |
          tar -tvzf assets/strata-*-linux-x64.tar.gz
          mkdir unpacked && tar -C unpacked -xzf assets/strata-*-linux-x64.tar.gz
          for tool in strata-golden strata-imgcmp; do
            mode=$(stat -c '%a' "unpacked/bin/$tool")
            if [ ! -x "unpacked/bin/$tool" ]; then
              echo "::error::bin/$tool is mode $mode in the tarball, not executable"; exit 1
            fi
            echo "bin/$tool: mode $mode"
          done
          # Run one straight from the tarball, with no chmod first: with no
          # arguments it prints its usage and exits 2 (126 would mean the
          # file is not executable).
          rc=0; unpacked/bin/strata-imgcmp || rc=$?
          if [ "$rc" -ne 2 ]; then echo "::error::bin/strata-imgcmp from the tarball exited $rc, expected 2"; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: assets/
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux, golden-linux, sanitize, build-web, build-windows, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: assets
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          cat assets/SHA256SUMS
          awk -v v="## ${version}" '$0==v{f=1;next} /^## /{f=0} f' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" assets/* --title "Strata ${version}" --notes-file notes.md --verify-tag
