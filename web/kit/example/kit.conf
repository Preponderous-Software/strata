# build-kit.sh settings for the example scene. CI sets STRATA_LIB and
# STRATA_INCLUDE to its own build; locally, a release tarball also works:
#   STRATA_VERSION=0.7.0 STRATA_SHA256=<from SHA256SUMS> web/kit/build-kit.sh web/kit/example/kit.conf
here="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
KIT_SOURCE="$here/main.cpp"
KIT_OUT="${KIT_OUT:-$here/out}"
KIT_NAME=example
KIT_EXPORT_NAME=createKitExample
KIT_EXPORTS=_ex_set_selected
KIT_PAGES="$here/index.html"
