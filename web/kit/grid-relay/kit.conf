# build-kit.sh settings for the grid relay (WIRE.md). CI sets STRATA_LIB and
# STRATA_INCLUDE to its own build; locally, a release tarball also works:
#   STRATA_VERSION=<v> STRATA_SHA256=<from SHA256SUMS> web/kit/build-kit.sh web/kit/grid-relay/kit.conf
here="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
KIT_SOURCE="$here/main.cpp"
KIT_OUT="${KIT_OUT:-$here/out}"
KIT_NAME=grid-relay-scene
KIT_EXPORT_NAME=createGridRelay
KIT_EXPORTS=_gr_submit,_gr_wire_version,_gr_set_ui_scale,_gr_orbit,_gr_messages,_gr_has_board
KIT_PAGES="$here/grid-relay.js $here/index.html"
