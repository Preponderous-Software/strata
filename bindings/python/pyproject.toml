[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "strata-engine"
version = "0.6.0"
description = "ctypes binding for the Strata engine's C ABI (libstrata is loaded, not bundled)"
license = { text = "MIT" }
requires-python = ">=3.8"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
]

[project.urls]
Source = "https://github.com/Preponderous-Software/strata"

[tool.setuptools]
packages = ["strata"]
